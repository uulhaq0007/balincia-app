name: balincia_app
description: "Balincia — the mobile companion to the Balincia perfume and attar store."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.1
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fraunces + Manrope, bundled so google_fonts never fetches at runtime.
  assets:
    - assets/google_fonts/
